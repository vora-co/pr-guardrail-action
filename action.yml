name: "PR Guardrail"
description: "Gates PRs that touch risky files or run shell commands behind an explicit human review — not a detector of AI authorship."
author: "Vora"
branding:
  icon: "shield"
  color: "purple"

inputs:
  github-token:
    description: >
      Token used to read PR files/commits/reviews and post the check run and
      comment. Defaults to the workflow's own GITHUB_TOKEN — you shouldn't
      need to set this.
    required: false
    default: ${{ github.token }}
  bot-allowlist:
    description: >
      Comma-separated list of author logins excluded from analysis entirely
      (in addition to the built-in defaults: dependabot[bot], renovate[bot],
      github-actions[bot]).
    required: false
    default: ""
  risky-file-patterns:
    description: >
      Comma-separated list of additional glob patterns treated as high-risk
      files, appended to the built-in list (migrations, IaC, permission and
      secret configs).
    required: false
    default: ""
  volume-threshold:
    description: >
      Maximum lines changed within `time-window` before the volume-anomaly
      signal fires. Must be a positive integer. Only blocks the PR when
      combined with the co-authored-by-agent signal.
    required: false
    default: "300"
  time-window:
    description: >
      Time window in minutes used to evaluate commit velocity for the
      volume-anomaly signal. Must be a positive integer.
    required: false
    default: "10"
  mode:
    description: >
      "block" fails the check run when a blocking signal fires. "warn"
      reports signals in the PR comment but always reports success, useful
      for dogfooding before enforcing.
    required: false
    default: "block"
  solo-maintainer-mode:
    description: >
      Off by default — the human gate behaves exactly as documented above.
      "self-ack" additionally lets the PR author satisfy the gate with an
      explicit `/guardrail-ack: <reason>` comment (not GitHub's native
      Approve, which still never counts from the author) after a cooldown
      since their last push. "second-agent" REPLACES the normal "any
      non-author approval counts" check with a stricter one: only an
      approving review from a login listed in `trusted-reviewer-agents`
      satisfies the gate — any other reviewer's approval, allowlisted or
      not, no longer counts on its own while this mode is active. Neither
      mode is presented as independent human review in the report.
    required: false
    default: "off"
  self-ack-min-length:
    description: >
      Minimum character length of the justification in a
      `/guardrail-ack: <reason>` comment for it to count. Rejects empty or
      one-word acks. Only relevant when solo-maintainer-mode is "self-ack".
    required: false
    default: "20"
  self-ack-cooldown-minutes:
    description: >
      Minimum minutes required between the PR's last commit and a
      `/guardrail-ack` comment for it to count — an ack posted in the same
      minute as the push doesn't count. Only relevant when
      solo-maintainer-mode is "self-ack".
    required: false
    default: "15"
  trusted-reviewer-agents:
    description: >
      Comma-separated list of GitHub logins explicitly trusted as a second
      reviewing agent. Never autodetected — must be configured by the repo
      owner. Only relevant when solo-maintainer-mode is "second-agent".
    required: false
    default: ""

runs:
  using: "node20"
  main: "dist/index.js"
