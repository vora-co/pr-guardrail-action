name: PR Guardrail
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: vora-co/pr-guardrail-action@main
